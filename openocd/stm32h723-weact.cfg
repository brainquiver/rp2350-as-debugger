# stm32h723-weact.cfg -- the WeAct MiniSTM32H723 through an RP2350 CMSIS-DAP probe.
#
# Source this AFTER the interface file and AFTER target/stm32h7x.cfg:
#
#     openocd -f interface/cmsis-dap.cfg -c "transport select swd" \
#             -f target/stm32h7x.cfg -f openocd/stm32h723-weact.cfg \
#             -c "init" -c "reset halt"
#
# This file is an example of the shape of a target configuration. The scope of this repository is
# the probe, and not the part on the other end of the cable.

# The order of this line is not free. target/stm32h7x.cfg sets its own "adapter speed 4000", so a
# speed given before that file is silently replaced. OpenOCD prints the speed it settled on, and
# that printed line is the only place the override shows.
#
# 15000 is where the rate stops improving. A read of 128 KiB runs at 237 KiB/s here and at
# 240 KiB/s at 25000, because the limit above 15 MHz is the USB round trip and the packet overhead
# rather than the SWD clock. The extra 3 KiB/s is not worth the timing margin it spends.
adapter speed 15000

# NRST reaches probe GP1, which is pad D7 on a XIAO RP2350 and the pad marked "NR" on the WeAct
# board. Verified: asserting SRST moves the target state from running to reset, and releasing it
# returns the target to running.
#
# connect_assert_srst is what recovers a part whose own firmware has gated the debug unit or entered
# a low power mode. Without it an unattended run stops at the first image that wedges.
#
# The probe drives this net as an open drain. It pulls low and releases to an input, and it never
# drives high, so it cannot fight the reset supervisor of the board.
reset_config srst_only srst_nogate connect_assert_srst

# With connect_assert_srst the part arrives held in reset. Therefore use "reset halt" and never a
# bare "halt", which waits out its whole timeout and then reports "external reset detected".
